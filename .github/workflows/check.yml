name: Check
on: [push, pull_request]
jobs:
  # pop-os/winit 0.31 web API still leaves iced_winit compositor futures
  # non-'static on wasm; Cosmic desktop does not ship wasm. Keep the job for
  # signal but do not fail the workflow on it.
  wasm:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTFLAGS: --cfg=web_sys_unstable_apis
    steps:
    - uses: hecrj/setup-rust-action@v2
      with:
        rust-version: stable
        targets: wasm32-unknown-unknown
    - uses: actions/checkout@master
    - name: Run checks
      run: cargo check --package iced --target wasm32-unknown-unknown
    - name: Check compilation of `tour` example
      run: cargo build --package tour --target wasm32-unknown-unknown
    - name: Check compilation of `todos` example
      run: cargo build --package todos --target wasm32-unknown-unknown

  widget:
    runs-on: ubuntu-latest
    steps:
    - uses: hecrj/setup-rust-action@v2
    - uses: actions/checkout@master
    - name: Check standalone `iced_widget` crate
      run: cargo check --package iced_widget --features image,svg,canvas
