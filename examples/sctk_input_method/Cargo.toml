[package]
name = "sctk_input_method"
version = "0.1.0"
authors = ["Eivind Gamst"]
edition = "2021"
publish = false

[dependencies]
iced.workspace = true
iced.features = [
    "tokio",
    "wayland",
    "winit",
    "debug",
    "tiny-skia",
    "a11y",
    "wgpu",
]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
iced_core.workspace = true
once_cell = "1.15"
cctk.workspace = true
log = "0.4.17"
env_logger = "0.10.0"
async-std = "1.0"
directories-next = "2.0.0"
tracing = "0.1"
lazy_static = "1.5.0"

